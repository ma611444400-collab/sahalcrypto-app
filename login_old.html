<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahal Crypto - Login</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00e676;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Sahal Crypto</h2>
    <p>Soo gal koontadaada</p>
    <input type="email" placeholder="Email-kaaga">
    <input type="password" placeholder="Password-kaaga">
    <button id="loginBtn">Login</button>
</div>
<script>
  document.getElementById("loginBtn").addEventListener("click", function() {
    alert("Badhanka wuu shaqaynayaa!");
  });
</script>

</body>
</html>
