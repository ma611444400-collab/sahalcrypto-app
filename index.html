<!DOCTYPE html>
<html lang="so">
<head>
    <script>
        // Security guard: If the user is not authenticated, redirect to login page immediately
        if (!localStorage.getItem('sahal_authenticated')) {
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahal Crypto | Dashboard-ka Rasmiga Ah</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0B0E11; /* Deep Modern Charcoal */
            --bg-card: #151A21; /* High Quality Dark Card */
            --bg-input: #1B222B; /* Dark Blue-Gray Input */
            --primary: #00C087; /* Sahal Mint Green */
            --primary-hover: #00E6A1;
            --primary-light: rgba(0, 192, 135, 0.1);
            --primary-border: rgba(0, 192, 135, 0.2);
            --danger: #FF4D4D; /* Warm Red */
            --text-main: #F0F3F5; /* Highly Readable White */
            --text-muted: #8E9BA5; /* Slate Gray */
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 75px; /* Spacing for Bottom Navigation on Mobile */
        }

        /* Responsive Frame for Desktop Layout */
        @media (min-width: 768px) {
            body {
                padding-bottom: 0;
                display: grid;
                grid-template-columns: 260px 1fr;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(142, 155, 165, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Sidebar Navigation - Tablet/Desktop ONLY */
        .sidebar {
            display: none;
            background-color: var(--bg-card);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            flex-direction: column;
            padding: 2rem 1.5rem;
            height: 100vh;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        @media (min-width: 768px) {
            .sidebar {
                display: flex;
            }
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.4rem;
            margin-bottom: 2.5rem;
        }

        .sidebar-brand i {
            color: var(--primary);
            font-size: 1.8rem;
        }

        .sidebar-brand span {
            color: var(--primary);
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            flex-grow: 1;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0.9rem 1.2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .sidebar-link:hover, .sidebar-link.active {
            color: var(--text-main);
            background-color: var(--primary-light);
            box-shadow: inset 3px 0 0 var(--primary);
        }

        .sidebar-link i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .sidebar-link.active i {
            color: var(--primary);
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), #00A3F5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #050709;
            font-size: 0.95rem;
        }

        .user-meta {
            overflow: hidden;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .user-email {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.8rem 1.2rem;
            color: var(--danger);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px;
            transition: background 0.25s ease;
            width: 100%;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: rgba(255, 77, 77, 0.08);
        }

        /* Mobile Header */
        .mobile-header {
            background-color: var(--bg-card);
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        @media (min-width: 768px) {
            .mobile-header {
                display: none;
            }
        }

        .mobile-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.25rem;
            color: white;
            text-decoration: none;
        }

        .mobile-brand i {
            color: var(--primary);
            font-size: 1.5rem;
        }

        .mobile-brand span {
            color: var(--primary);
        }

        .mobile-header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-circle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
            transition: all 0.25s;
        }

        .icon-circle-btn:active {
            transform: scale(0.92);
            background: rgba(0, 192, 135, 0.1);
            color: var(--primary);
        }

        .notification-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
        }

        /* Mobile Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-card);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .bottom-nav {
                display: none;
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            flex: 1;
            padding: 4px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 1.3rem;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        /* Main Content Workspace */
        main {
            padding: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            main {
                padding: 2.5rem;
                height: 100vh;
                overflow-y: auto;
            }
        }

        /* App Sections/Views */
        .app-view {
            display: none;
            animation: fadeIn 0.35s ease-out;
        }

        .app-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SECTION: Dashboard View Components */
        /* Balance Container Card */
        .balance-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, #1c242e 100%);
            border: 1px solid var(--primary-border);
            border-radius: 20px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 192, 135, 0.05);
        }

        .balance-card::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(0, 192, 135, 0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -20px;
            right: -20px;
            pointer-events: none;
        }

        .balance-header {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .balance-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 0.4rem;
        }

        .balance-value {
            font-size: 2.2rem;
            font-family: var(--font-main);
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .percentage-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 192, 135, 0.12);
            border: 1px solid rgba(0, 192, 135, 0.2);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 30px;
            font-family: var(--font-mono);
        }

        .currency-equivalent {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 600;
            font-family: var(--font-mono);
        }

        /* Global Floating Decorative Download Area */
        .apk-banner-quick {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(0, 192, 135, 0.1) 0%, rgba(11, 14, 17, 0.5) 100%);
            border: 1px dashed var(--primary-border);
            padding: 10px 16px;
            border-radius: 12px;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .apk-banner-quick a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .apk-banner-quick a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Refresh Live Rates Bar */
        .refresh-rates-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary);
            transition: all 0.25s;
            cursor: pointer;
            user-select: none;
            margin-bottom: 2rem;
        }

        .refresh-rates-bar:active {
            transform: scale(0.98);
            background: rgba(0, 192, 135, 0.05);
        }

        .spin {
            animation: rotating 0.8s linear;
        }

        @keyframes rotating {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Rapid Ticker Row Grid */
        .ticker-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }

        @media (min-width: 992px) {
            .ticker-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .ticker-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.25s;
            cursor: pointer;
        }

        .ticker-card:hover {
            border-color: var(--primary-border);
        }

        .ticker-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .ticker-label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-label img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .ticker-price {
            font-size: 1.15rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: white;
        }

        .ticker-change {
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .ticker-change.up {
            color: var(--primary);
        }

        .ticker-change.down {
            color: var(--danger);
        }

        /* 4-Item Services Matrix Grid (Dashboard Actions) */
        .dashboard-actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 2.2rem;
        }

        .action-grid-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .action-grid-card:hover, .action-grid-card:active {
            border-color: var(--primary-border);
            background-color: rgba(255, 255, 255, 0.02);
            transform: translateY(-2px);
        }

        .action-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background-color: rgba(0, 192, 135, 0.08);
            border: 1px solid rgba(0, 192, 135, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.25rem;
        }

        .action-icon-box.withdraw {
            background-color: rgba(0, 163, 245, 0.08); /* Ocean Blue Withdraw look */
            border-color: rgba(0, 163, 245, 0.15);
            color: #00A3F5;
        }

        .action-icon-box.p2p {
            background-color: rgba(255, 179, 0, 0.08); /* Amber Yellow style */
            border-color: rgba(255, 179, 0, 0.15);
            color: #FFB300;
        }

        .action-icon-box.scan {
            background-color: rgba(162, 0, 255, 0.08); /* Purple Scan QR design */
            border-color: rgba(162, 0, 255, 0.15);
            color: #A200FF;
        }

        .action-grid-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .action-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: white;
        }

        .action-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Recent Activity Title Header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            margin-top: 1rem;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--primary);
        }

        .section-link {
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .section-link:hover {
            text-decoration: underline;
            color: var(--primary-hover);
        }

        /* Transaction List */
        .transaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .transaction-item {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.25s;
        }

        .transaction-item:hover {
            background-color: rgba(255, 255, 255, 0.015);
        }

        .txn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .txn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
        }

        .txn-icon.in {
            background-color: rgba(0, 192, 135, 0.08);
            border: 1px solid rgba(0, 192, 135, 0.15);
            color: var(--primary);
        }

        .txn-icon.out {
            background-color: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.15);
            color: var(--danger);
        }

        .txn-detail {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .txn-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: white;
        }

        .txn-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .txn-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .txn-amount {
            font-size: 0.98rem;
            font-weight: 800;
            font-family: var(--font-mono);
        }

        .txn-amount.plus {
            color: var(--primary);
        }

        .txn-amount.minus {
            color: var(--danger);
        }

        .txn-status {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
        }

        .txn-status.completed {
            background-color: rgba(0, 192, 135, 0.08);
            color: var(--primary);
        }

        .txn-status.pending {
            background-color: rgba(255, 179, 0, 0.08);
            color: #FFB300;
        }

        /* SECTION: Boorsada (Wallet) View Components */
        .assets-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .asset-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .asset-left-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .asset-icon-brand {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bolder;
            background-color: #1b222b;
        }

        .asset-icon-brand.usdt { background: rgba(0, 192, 135, 0.1); color: var(--primary); }
        .asset-icon-brand.btc { background: rgba(255, 179, 0, 0.1); color: #FFB300; }
        .asset-icon-brand.eth { background: rgba(162, 0, 255, 0.1); color: #A200FF; }

        .asset-titles {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .asset-code {
            font-size: 1.1rem;
            font-weight: 800;
            color: white;
        }

        .asset-fullname {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .asset-right-values {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .asset-balance {
            font-size: 1.15rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: white;
        }

        .asset-fiat {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
            font-family: var(--font-mono);
        }

        .wallet-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 2rem;
        }

        .btn-wallet-action {
            padding: 1rem;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-wallet-action.deposit {
            background-color: var(--primary);
            color: #050709;
        }

        .btn-wallet-action.deposit:hover {
            background-color: var(--primary-hover);
        }

        .btn-wallet-action.withdraw {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
        }

        .btn-wallet-action.withdraw:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Somali Accounts Card */
        .somali-fiat-accounts {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 18px;

        .fiat-account-row {

            height: 32px;

            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
        }

        .fiat-avatar.evc { background-color: rgba(0, 192, 135, 0.12); color: var(--primary); }
        .fiat-avatar.edahab { background-color: rgba(0, 163, 245, 0.12); color: #00A3F5; }

        .fiat-balance {
            font-family: var(--font-mono);
            font-weight: 700;
            color: white;
        }

        /* SECTION: Suuqa (Market) View Components */
        .market-search-box {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .market-search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .market-input {
            width: 100%;
            padding: 1rem 1rem 1rem 42px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            background-color: var(--bg-input);
            color: white;
            font-family: var(--font-main);
            font-size: 0.95rem;
            transition: all 0.25s;
        }

        .market-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 192, 135, 0.1);
        }

        .filter-tabs-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 1.5rem;
            scrollbar-width: none;
        }

        .filter-tabs-row::-webkit-scrollbar {
            display: none;
        }

        .filter-tab-pill {
            padding: 8px 16px;
            border-radius: 30px;
            background-color: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab-pill.active {
            background-color: var(--primary);
            color: #050709;
            border-color: var(--primary);
        }

        .market-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .market-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .market-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 10px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            transition: background 0.2s;
            cursor: pointer;
        }

        .market-row:hover {
            background-color: rgba(255,255,255,0.015);
        }

        .market-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coin-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            background-color: var(--bg-input);
        }

        .coin-icon.usdt { background: rgba(0, 192, 135, 0.08); color: var(--primary); }
        .coin-icon.btc { background: rgba(255, 179, 0, 0.08); color: #FFB300; }
        .coin-icon.eth { background: rgba(162, 0, 255, 0.08); color: #A200FF; }
        .coin-icon.sol { background: rgba(0, 224, 255, 0.08); color: #00E0FF; }
        .coin-icon.bnb { background: rgba(243, 186, 47, 0.08); color: #F3BA2F; }

        .coin-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .coin-symbol {
            font-size: 1rem;
            font-weight: 800;
            color: white;
        }

        .coin-name {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .market-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
        }

        .coin-price {
            font-size: 1.05rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: white;
        }

        .coin-change-pill {
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .coin-change-pill.up { color: var(--primary); }
        .coin-change-pill.down { color: var(--danger); }

        /* SECTION: Ganacsiga (Trade) View Components */
        .trade-container {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 1.8rem;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .trade-direction-tabs {
            display: flex;
            background-color: rgba(11, 14, 17, 0.6);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .trade-dir-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            background: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .trade-dir-btn.active.buy {
            background-color: var(--primary);
            color: #050709;
        }

        .trade-dir-btn.active.sell {
            background-color: var(--danger);
            color: white;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .trade-select, .trade-input-field {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            background-color: var(--bg-input);
            color: white;
            font-family: var(--font-main);
            font-size: 0.98rem;
            transition: border-color 0.25s;
        }

        .trade-select:focus, .trade-input-field:focus {
            outline: none;
            border-color: var(--primary);
        }

        .input-with-badge {
            position: relative;
        }

        .input-badge {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .trade-quote-details {
            background-color: rgba(11, 14, 17, 0.4);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quote-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .quote-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .quote-value {
            font-weight: 700;
            color: white;
            font-family: var(--font-mono);
        }

        .quote-value.highlight {
            color: var(--primary);
        }

        .btn-submit-trade {
            width: 100%;
            padding: 1.1rem;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-submit-trade.buy {
            background-color: var(--primary);
            color: #050709;
        }

        .btn-submit-trade.buy:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit-trade.sell {
            background-color: var(--danger);
            color: white;
        }

        .btn-submit-trade.sell:hover {
            opacity: 0.9;
        }

        /* CUSTOM MODALS SYSTEM (Interactables) */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--primary-border);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 1.8rem;
            position: relative;
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from { transform: scale(0.9) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: white;
            background: rgba(255,255,255,0.08);
        }

        .modal-header {
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-header i {
            font-size: 1.4rem;
            color: var(--primary);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: white;
        }

        /* Success & Feedback Overlay screens */
        .status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-color);
            z-index: 300;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .status-overlay.active {
            display: flex;
        }

        .success-checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: rgba(0, 192, 135, 0.1);
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(0, 192, 135, 0.15);
            animation: scaleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .status-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
        }

        .status-message {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.8rem;
            max-width: 320px;
        }

        .btn-status-done {
            padding: 1rem 2.5rem;
            border-radius: 12px;
            border: none;
            background-color: var(--primary);
            color: #050709;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-status-done:hover {
            background-color: var(--primary-hover);
        }

        /* QR Scanner Simulator */
        .qr-scanner-box {
            border: 2px dashed rgba(0, 192, 135, 0.4);
            border-radius: 12px;
            height: 200px;
            background: rgba(0, 192, 135, 0.02);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary);
            animation: scanMove 2s infinite linear;
        }

        @keyframes scanMove {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        /* Simple utilities */
        .text-up { color: var(--primary) !important; }
        .text-down { color: var(--danger) !important; }

        .market-p2p-badge {
            background-color: rgba(255, 179, 0, 0.1);
            color: #FFB300;
            border: 1px solid rgba(255, 179, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }/* Mobile Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-card);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .bottom-nav {
                display: none;
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            flex: 1;
            padding: 4px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-item i {
            font-size: 1.3rem;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        /* Main Content Workspace */
        main {
            padding: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            main {
                padding: 2.5rem;
                height: 100vh;
                overflow-y: auto;
            }
        }

        /* App Sections/Views */
        .app-view {
            display: none;
            animation: fadeIn 0.35s ease-out;
        }

        .app-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SECTION: Dashboard View Components */
        /* Balance Container Card */
        .balance-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, #1c242e 100%);
            border: 1px solid var(--primary-border);
            border-radius: 20px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 192, 135, 0.05);
        }

        .balance-card::after {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(0, 192, 135, 0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -20px;
            right: -20px;
            pointer-events: none;
        }

        .balance-header {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .balance-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 0.4rem;
        }

        .balance-value {
            font-size: 2.2rem;
            font-family: var(--font-main);
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .percentage-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 192, 135, 0.12);
            border: 1px solid rgba(0, 192, 135, 0.2);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 30px;
            font-family: var(--font-mono);
        }

        .currency-equivalent {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 600;
            font-family: var(--font-mono);
        }

        /* Global Floating Decorative Download Area */
        .apk-banner-quick {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(0, 192, 135, 0.1) 0%, rgba(11, 14, 17, 0.5) 100%);
            border: 1px dashed var(--primary-border);
            padding: 10px 16px;
            border-radius: 12px;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .apk-banner-quick a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .apk-banner-quick a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Refresh Live Rates Bar */
        .refresh-rates-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary);
            transition: all 0.25s;
            cursor: pointer;
            user-select: none;
            margin-bottom: 2rem;
        }

        .refresh-rates-bar:active {
            transform: scale(0.98);
            background: rgba(0, 192, 135, 0.05);
        }

        .spin {
            animation: rotating 0.8s linear;
        }

        @keyframes rotating {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Rapid Ticker Row Grid */
        .ticker-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }

        @media (min-width: 992px) {
            .ticker-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .ticker-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: border-color 0.25s;
            cursor: pointer;
        }

        .ticker-card:hover {
            border-color: var(--primary-border);
        }

        .ticker-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .ticker-label {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ticker-label img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }

        .ticker-price {
            font-size: 1.15rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: white;
        }

        .ticker-change {
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .ticker-change.up {
            color: var(--primary);
        }

        .ticker-change.down {
            color: var(--danger);
        }

        /* 4-Item Services Matrix Grid (Dashboard Actions) */
        .dashboard-actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 2.2rem;
        }

        .action-grid-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .action-grid-card:hover, .action-grid-card:active {
            border-color: var(--primary-border);
            background-color: rgba(255, 255, 255, 0.02);
            transform: translateY(-2px);
        }

        .action-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background-color: rgba(0, 192, 135, 0.08);
            border: 1px solid rgba(0, 192, 135, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.25rem;
        }

        .action-icon-box.withdraw {
            background-color: rgba(0, 163, 245, 0.08);
            border-color: rgba(0, 163, 245, 0.15);
            color: #00A3F5;
        }

        .action-icon-box.p2p {
            background-color: rgba(255, 179, 0, 0.08);
            border-color: rgba(255, 179, 0, 0.15);
            color: #FFB300;
        }

        .action-icon-box.scan {
            background-color: rgba(162, 0, 255, 0.08);
            border-color: rgba(162, 0, 255, 0.15);
            color: #A200FF;
        }

        .action-grid-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .action-title {
            font-size: 0.98rem;
            font-weight: 700;
            color: white;
        }

        .action-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Recent Activity Title Header */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
