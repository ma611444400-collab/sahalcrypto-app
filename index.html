<!DOCTYPE html>
<html>
<head>
    <title>SahalCrypto</title>
    <!-- Security guard -->
    <script>
        if (!localStorage.getItem('sahal_authenticated')) {
            // Haddii uu qofku login ka baxsan yahay, u daa login-ka
        }
    </script>    <style>
        :root {
            --bg-color: #0B0E11;
            --primary: #00C087;
            --card-bg: #161A21;
            --text-color: #FFFFFF;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }

        #login-section, #otp-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
    </style>

</head>
<body>
    <h1>Ku soo dhowada SahalCrypto</h1>

    <div id="login-section">
        <input type="tel" id="phone-number" placeholder="+252 61XXXXXXX">
        <button id="send-code-btn">Koodhka ii dir</button>
    </div>

    <div id="otp-section" style="display:none;">
        <input type="text" id="otp-code" placeholder="Geli koodhka 6-da lambar">
        <button id="verify-code-btn">Hubi koodhka</button>
    </div>

    <nav class="nav-links"></nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPhoneNumber, RecaptchaVerifier } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCSwkI6G5EifxnPuOHiHm4JsubS_jkeaW",
            authDomain: "sahal-crypto-exchange.firebaseapp.com",
            projectId: "sahal-crypto-exchange",
            storageBucket: "sahal-crypto-exchange.appspot.com",
            messagingSenderId: "349841304186",
            appId: "1:349841304186:web:aab9d616bfb09fc230a9c3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'send-code-btn', { 'size': 'invisible' });

        document.getElementById('send-code-btn').addEventListener('click', () => {
            const phoneNumber = document.getElementById('phone-number').value;
            signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
            .then((confirmationResult) => {
                window.confirmationResult = confirmationResult;
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('otp-section').style.display = 'block';
            }).catch((error) => { alert("Khalad: " + error.message); });
        });

        document.getElementById('verify-code-btn').addEventListener('click', () => {
            const code = document.getElementById('otp-code').value;
            window.confirmationResult.confirm(code).then((result) => {
                localStorage.setItem('sahal_authenticated', 'true');
                localStorage.setItem('sahal_username', result.user.phoneNumber);
                alert("Si guul leh ayaad u gashay!");
                window.location.reload();
            }).catch((error) => { alert("Koodhkaagu waa qaldan yahay!"); });
        });

        // Logout iyo Session Script
        const isAuthenticated = localStorage.getItem('sahal_authenticated');// Qari login-ka haddii qofku uu soo galay
if (isAuthenticated) {
    document.getElementById('login-section').style.display = 'none';
}

        if (isAuthenticated) {
            const navLinks = document.querySelector('.nav-links');
            const logoutBtn = document.createElement('a');
            logoutBtn.href = '#';
            logoutBtn.innerHTML = 'Ka bax';
            logoutBtn.onclick = () => {
                localStorage.removeItem('sahal_authenticated');
                window.location.reload();
            };
            navLinks.appendChild(logoutBtn);
        }
    </script>
</body>
</html>
